name: test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  checks: write

jobs:
  hono-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: videoreview_test
        options: >-
          --health-cmd "pg_isready -U user -d videoreview_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Prepare test env
        run: cp .example.test.env .env.test
      - name: Run hono tests
        id: run_tests
        run: |
          mkdir -p test-results
          npm run test:hono
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Hono Tests
          path: tests/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true
      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hono-junit-report
          path: tests/test-results/junit.xml
