name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm run build
        env: 
          CI_BUILD: true

  maintenance-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: maintenance/go.mod
      - name: Build maintenance CLI
        run: go build ./...

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web-runtime
            dockerfile: docker/web/Dockerfile
          - name: web-prod
            dockerfile: docker/web/Dockerfile.prod
          - name: video-processing
            dockerfile: docker/video-processing/Dockerfile
          - name: video-analysis-cpu
            dockerfile: docker/video-analysis/Dockerfile.cpu
          - name: video-analysis-gpu
            dockerfile: docker/video-analysis/Dockerfile.gpu
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          provenance: false
