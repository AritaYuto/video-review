services:
  videoreview:
    environment:
      NEXT_PUBLIC_VIDEO_REVIEW_USE_AI_SUPPORT: "true"

  video-analysis:
    env_file:
      - .env

    image: video-analysis:latest
    container_name: videoreview-video-analysis
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://videoreview:videoreview@db:5432/videoreview
      VIDEO_REVIEW_LOCAL_ROOTDIR: /storage

    volumes:
      - ${DOCKER_HOST_STORAGE:-videoreview-storage}:/storage

    depends_on:
      - db

volumes:
  videoreview-storage:
  videoreview-db:
